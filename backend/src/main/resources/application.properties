spring.application.name=fragrance-api
server.error.include-message=always
fragrance.provider=10ml
fragrance.tenml.base-url=https://mcp.10ml.com
fragrance.awin.publisher-id=${AWIN_PUBLISHER_ID:}
fragrance.awin.api-token=${AWIN_API_TOKEN:}
fragrance.awin.advertiser-id=${AWIN_ADVERTISER_ID:6561}
fragrance.awin.locale=${AWIN_LOCALE:en_GB}
spring.datasource.url=jdbc:h2:file:./data/sillage-users
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30d
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
sillage.mail.from=${MAIL_FROM:no-reply@sillage.app}
