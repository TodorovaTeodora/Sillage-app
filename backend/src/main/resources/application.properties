spring.application.name=fragrance-api
server.error.include-message=always
fragrance.provider=10ml
fragrance.tenml.base-url=https://mcp.10ml.com
fragrance.awin.publisher-id=${AWIN_PUBLISHER_ID:}
fragrance.awin.api-token=${AWIN_API_TOKEN:}
fragrance.awin.advertiser-id=${AWIN_ADVERTISER_ID:6561}
fragrance.awin.locale=${AWIN_LOCALE:en_GB}
spring.datasource.url=jdbc:h2:file:./data/sillage-users
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30d
